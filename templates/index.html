<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Massive Stock Watchlist</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container">
    <h1>Stock Watchlist</h1>
    <p class="hint">Enter a single ticker symbol. This sends exactly ONE call to the Massive API to fetch the latest price, then adds it to your watchlist.</p>

    <div class="form-card">
      <form id="stock-form">
        <div class="input-group">
          <label for="symbol">Ticker symbol</label>
          <input type="text" id="symbol" name="symbol" placeholder="AAPL" required>
        </div>
        <button type="submit">Add to watchlist</button>
      </form>
    </div>

    <div id="result"></div>

    <div class="table-container">
      <table id="watchlist-table">
        <thead>
          <tr>
            <th>Symbol</th>
            <th>Email</th>
            <th>Latest price</th>
            <th>Updated</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="watchlist-body"></tbody>
      </table>
    </div>
  </div>

  <script>
    const form = document.getElementById("stock-form");
    const resultEl = document.getElementById("result");
    const watchlistBody = document.getElementById("watchlist-body");

    async function loadWatchlist() {
      try {
        const resp = await fetch("/watchlist");
        const data = await resp.json();
        if (!resp.ok) {
          resultEl.textContent = "Error loading watchlist: " + (data.error || resp.statusText);
          return;
        }
        watchlistBody.innerHTML = "";
        data.forEach((row) => {
          const tr = document.createElement("tr");
          const price = row.latest_price !== null && row.latest_price !== undefined
            ? Number(row.latest_price).toFixed(2)
            : "-";
          const updated = row.updated_at ? new Date(row.updated_at).toLocaleString() : "-";
          tr.innerHTML = `
            <td>${row.symbol}</td>
            <td>${row.email || "-"}</td>
            <td>${price}</td>
            <td>${updated}</td>
            <td><button class="delete-btn" data-symbol="${row.symbol}">Delete</button></td>
          `;
          watchlistBody.appendChild(tr);
        });
      } catch (err) {
        resultEl.textContent = "Failed to load watchlist: " + err;
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const symbol = document.getElementById("symbol").value;
      resultEl.textContent = "Adding to watchlist...";

      try {
        const resp = await fetch("/watchlist", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ symbol }),
        });
        const data = await resp.json();
        if (!resp.ok) {
          resultEl.textContent = "Error: " + (data.error || resp.statusText);
          return;
        }
        resultEl.textContent = "Added " + data.symbol + " at price " + data.latest_price;
        document.getElementById("symbol").value = "";
        loadWatchlist();
      } catch (err) {
        resultEl.textContent = "Request failed: " + err;
      }
    });

    // Delete handler with event delegation
    watchlistBody.addEventListener("click", async (e) => {
      if (e.target.classList.contains("delete-btn")) {
        const symbol = e.target.dataset.symbol;
        const row = e.target.closest("tr");
        
        if (!confirm(`Remove ${symbol} from watchlist?`)) {
          return;
        }

        row.classList.add("deleting");
        
        try {
          const resp = await fetch(`/watchlist?symbol=${symbol}`, {
            method: "DELETE",
          });
          const data = await resp.json();
          if (!resp.ok) {
            resultEl.textContent = "Error: " + (data.error || resp.statusText);
            row.classList.remove("deleting");
            return;
          }
          resultEl.textContent = `Removed ${symbol} from watchlist`;
          row.classList.add("fade-out");
          setTimeout(() => {
            loadWatchlist();
          }, 300);
        } catch (err) {
          resultEl.textContent = "Delete failed: " + err;
          row.classList.remove("deleting");
        }
      }
    });

    loadWatchlist();
  </script>
</body>
</html>
